# Builds the Windows installer (packaging/windows/build.ps1) on a GitHub
# Windows runner. On a "v*" tag the installer is attached to the GitHub
# release of that tag (the release is created if it does not exist yet);
# started by hand ("Run workflow") it is only kept as a build artifact.
name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: FFmpeg (gyan.dev release essentials, checksum verified)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile $zip
          $expected = (Invoke-RestMethod https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256).Trim().Split()[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "FFmpeg checksum mismatch: $actual vs $expected" }
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "FFMPEG_BIN=$bin" >> $env:GITHUB_ENV

      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -FfmpegDir $env:FFMPEG_BIN

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/BlindCue-Setup-*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --generate-notes }
          gh release upload $tag (Get-Item dist\BlindCue-Setup-*.exe).FullName --clobber
