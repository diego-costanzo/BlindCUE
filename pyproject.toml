[project]
name = "blindcue"
version = "0.1.0"
description = "Minimal failsafe audio/video cue player for live theatre"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Diego Costanzo"}]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0,<7",
    "numpy>=1.24.0,<3",
    "qrcode>=7.4.2,<9",
]

[project.optional-dependencies]
# The show assistant (blindcue/mcp_server): an AI client prepares show files.
assistant = ["mcp>=1.30,<2"]

[tool.pytest.ini_options]
# Collect only the real test suite. Without this, pytest also scans the
# production package and tries to collect engine/player_test.py (the live
# "test/preview" player), which is not a test module.
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

